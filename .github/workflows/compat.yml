name: Compatibility Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 02:00 UTC — catches regressions from upstream changes
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Secrets required (Settings → Secrets → Actions), DoIP/comparison work only:
#   GH_PAT  — personal access token with read access to Xaloqi/TestLab
#              (repo scope). Needed only by the DoIP full-matrix legs and
#              the cross-target comparison job, both of which install the
#              TestLab Pro package (workspace/DoIP transport and the
#              `report`/`compare` CLI commands are Pro-only, per the OD-15
#              open-core split — xaloqi.com). virtual-validation and the
#              CAN full-matrix legs need no secret at all: they install the
#              free, public `xaloqi-tester` package from PyPI, so anyone
#              who forks this repo can reproduce the badge with zero setup.
# ---------------------------------------------------------------------------

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Virtual validation
  # Runs on every push/PR. No ECU builds, no hardware, no secrets. Installs
  # the free, public xaloqi-tester package from PyPI and runs the campaign
  # against the in-process VirtualBus ECU simulator. Drives the public
  # status badge — independently reproducible by anyone (OD-14).
  # ---------------------------------------------------------------------------
  virtual-validation:
    name: "Virtual validation (all services, no hardware)"
    runs-on: ubuntu-22.04

    env:
      XALOQI_LICENSE_SKIP: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install xaloqi-tester (free, public — no secret needed)
        run: pip install xaloqi-tester

      - name: Validate campaign YAML (--dry-run)
        run: |
          testlab-run \
            --config   configs/basic_ecu.yaml \
            --campaign campaigns/core_validation.yaml \
            --dry-run

      - name: Run virtual campaign
        run: |
          mkdir -p reports
          testlab-run \
            --config   configs/basic_ecu.yaml \
            --campaign campaigns/core_validation.yaml \
            --job      core_validation \
            --virtual  \
            --json     reports/virtual_run.json

      - name: Analyse results
        run: testlab analyze --results reports/virtual_run.json

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: virtual-reports
          path: reports/

  # ---------------------------------------------------------------------------
  # Job 2: Full compatibility matrix (Zephyr + FreeRTOS builds)
  # Builds each ECU simulator from source, launches it, and runs the same
  # campaign against each variant. continue-on-error: true keeps the badge
  # green (driven by virtual-validation above) while full builds are in
  # progress or unavailable.
  # ---------------------------------------------------------------------------
  full-matrix:
    name: "Full matrix (${{ matrix.target }})"
    runs-on: ubuntu-22.04
    needs: virtual-validation
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - target:      basic_ecu
            transport:   CAN
            rtos:        Zephyr
            board:       native_sim
            config_flag: "--config configs/basic_ecu.yaml --interface vcan0"
            build_type:  zephyr

          - target:      basic_ecu_doip
            transport:   DoIP
            rtos:        Zephyr
            board:       native_sim
            config_flag: "--workspace configs/basic_ecu_doip.yaml"
            build_type:  zephyr

          - target:      basic_ecu_freertos
            transport:   CAN
            rtos:        FreeRTOS
            board:       qemu_cortex_m4
            config_flag: "--config configs/basic_ecu_freertos.yaml --interface vcan0"
            build_type:  freertos

          - target:      basic_ecu_doip_freertos
            transport:   DoIP
            rtos:        FreeRTOS
            board:       qemu_cortex_m4
            config_flag: "--workspace configs/basic_ecu_doip_freertos.yaml"
            build_type:  freertos

    env:
      XALOQI_LICENSE_SKIP: "1"
      ZEPHYR_SDK_VERSION:  "0.17.0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # CAN targets: free, public xaloqi-tester — no secret needed.
      - name: Install xaloqi-tester (free, public)
        if: matrix.transport == 'CAN'
        run: pip install xaloqi-tester

      # DoIP targets: real DoIP transport + --workspace are TestLab Pro
      # features (post OD-15 open-core split), so these two legs alone
      # still need the private-repo Pro package. This job is already
      # continue-on-error and doesn't drive the public badge.
      - name: Verify GH_PAT is configured (DoIP targets need TestLab Pro)
        if: matrix.transport == 'DoIP'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::GH_PAT secret is not set. DoIP targets need TestLab Pro (private repo) — see the top-of-file note. Skipping is fine; virtual-validation and the CAN legs don't need it."
            exit 1
          fi

      - name: Install xaloqi-tester (TestLab Pro, for DoIP/--workspace)
        if: matrix.transport == 'DoIP'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # Clone without submodules — testlab-dashboard is private and not needed for xaloqi-tester.
          # pip's git+ URL always recurses submodules; cloning manually avoids that.
          git clone --depth=1 --no-recurse-submodules \
            "https://${GH_PAT}@github.com/Xaloqi/TestLab.git" /tmp/testlab
          pip install "/tmp/testlab[dev]"

      # EDS is public — no token needed to check it out.
      - name: Check out Xaloqi EDS
        uses: actions/checkout@v4
        with:
          repository: Xaloqi/EDS
          path: EDS
          ref: main
          submodules: recursive

      # No EDS-toolchain checkout, no template symlink: every EDS example
      # ships its generated C pre-committed (examples/*/generated/), so
      # `west build`/cmake below builds directly from that — no codegen
      # invocation, no commercial templates needed (OD-14 Option 2). This
      # is also the first real test of EDS#198 (does a genuine CI checkout
      # + west build actually skip codegen via mtime staleness, with no
      # tools/templates/ present at all) rather than continued reasoning
      # about it.

      # ── Zephyr targets ────────────────────────────────────────────────────
      - name: Install west + Zephyr SDK
        if: matrix.build_type == 'zephyr'
        run: |
          pip install west
          west init -l EDS
          west update --narrow --fetch-opt=--depth=1
          wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZEPHYR_SDK_VERSION}/zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64_minimal.tar.xz"
          tar xf "zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64_minimal.tar.xz" -C /opt
          /opt/zephyr-sdk-${ZEPHYR_SDK_VERSION}/setup.sh -t x86_64-zephyr-elf -c
          pip install jinja2
          pip install -r EDS/scripts/requirements-base.txt 2>/dev/null || true

      - name: Build (Zephyr native_sim)
        if: matrix.build_type == 'zephyr'
        run: |
          # -DDIAG_SKIP_CODEGEN=ON: use the pre-committed examples/*/generated/
          # output as-is instead of letting the run_codegen custom target try
          # to regenerate it. Required here, not optional: confirmed in this
          # exact CI (see EDS#198) that a real actions/checkout@v4 + west
          # build does NOT skip codegen via mtime staleness the way a plain
          # local git clone appears to; without this flag the build fails
          # with "Code generator templates not found" (no Developer license
          # in this job for CAN targets).
          west build -p always -b ${{ matrix.board }} \
            --build-dir build/${{ matrix.target }} \
            EDS/examples/${{ matrix.target }} \
            -- -DDIAG_SKIP_CODEGEN=ON

      # ── FreeRTOS targets ──────────────────────────────────────────────────
      - name: Install FreeRTOS-Kernel + QEMU + toolchain
        if: matrix.build_type == 'freertos'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm ninja-build
          git clone --depth=1 https://github.com/FreeRTOS/FreeRTOS-Kernel.git \
            /opt/freertos-kernel

      - name: Build (FreeRTOS / QEMU)
        if: matrix.build_type == 'freertos'
        run: |
          cmake -S EDS/examples/${{ matrix.target }} \
                -B build/${{ matrix.target }} \
                -GNinja \
                -DEDS_PLATFORM=freertos \
                -DFREERTOS_DIR=/opt/freertos-kernel \
                -DBOARD=qemu_cortex_m4 \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
                "-DCMAKE_C_FLAGS=-I$(pwd)/EDS/platform/zephyr"
          ninja -C build/${{ matrix.target }}

      # ── CAN interface setup ───────────────────────────────────────────────
      - name: Set up vcan0
        if: matrix.transport == 'CAN'
        run: |
          sudo apt-get install -y --no-install-recommends linux-modules-extra-azure 2>/dev/null || true
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0

      # ── Launch ECU + run campaign ─────────────────────────────────────────
      - name: Launch ECU simulator
        run: |
          if [ "${{ matrix.build_type }}" = "zephyr" ]; then
            ./build/${{ matrix.target }}/zephyr/zephyr.exe &
          else
            qemu-system-arm \
              -machine lm3s6965evb \
              -kernel build/${{ matrix.target }}/basic_ecu.elf \
              -net nic,model=stellaris \
              -net user,hostfwd=tcp::13400-:13400 \
              -nographic -serial /dev/null &
          fi
          echo "ECU_PID=$!" >> "$GITHUB_ENV"
          sleep 2

      - name: Run core_validation campaign
        run: |
          mkdir -p reports
          testlab-run \
            --campaign campaigns/core_validation.yaml \
            --job      core_validation \
            ${{ matrix.config_flag }} \
            --json     reports/${{ matrix.target }}_run.json

      - name: Stop ECU simulator
        if: always()
        run: kill "$ECU_PID" 2>/dev/null || true

      - name: Analyse results
        run: testlab analyze --results reports/${{ matrix.target }}_run.json

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.target }}
          path: reports/

  # ---------------------------------------------------------------------------
  # Job 3: Cross-target comparison
  # Downloads all four JSON reports and runs testlab compare between pairs.
  # Warnings (not errors) on regression so the badge stays informational.
  # ---------------------------------------------------------------------------
  compare:
    name: "Cross-target comparison"
    runs-on: ubuntu-22.04
    needs: full-matrix
    if: always()
    continue-on-error: true   # only meaningful when full-matrix reports exist

    env:
      XALOQI_LICENSE_SKIP: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `testlab compare`/`report` are TestLab Pro CLI commands (post OD-15
      # split), so this informational job keeps using the private Pro
      # package + GH_PAT. It's continue-on-error and doesn't drive the
      # public badge, so this doesn't affect OD-14 reproducibility.
      - name: Install xaloqi-tester (TestLab Pro, for compare/report)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # Clone without submodules — testlab-dashboard is private and not needed for xaloqi-tester.
          # pip's git+ URL always recurses submodules; cloning manually avoids that.
          git clone --depth=1 --no-recurse-submodules \
            "https://${GH_PAT}@github.com/Xaloqi/TestLab.git" /tmp/testlab
          pip install "/tmp/testlab[dev]"

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          pattern: reports-*
          merge-multiple: true
          path: reports/

      - name: Compare CAN targets (Zephyr vs FreeRTOS)
        run: |
          testlab compare \
            --before reports/basic_ecu_run.json \
            --after  reports/basic_ecu_freertos_run.json \
          || echo "::warning::Regression: basic_ecu vs basic_ecu_freertos"

      - name: Compare DoIP targets (Zephyr vs FreeRTOS)
        run: |
          testlab compare \
            --before reports/basic_ecu_doip_run.json \
            --after  reports/basic_ecu_doip_freertos_run.json \
          || echo "::warning::Regression: basic_ecu_doip vs basic_ecu_doip_freertos"

      - name: Generate HTML comparison report
        run: |
          jsons=$(ls reports/*_run.json 2>/dev/null | tr '\n' ' ')
          if [ -z "$jsons" ]; then
            echo "No JSON reports available — skipping HTML generation."
            exit 0
          fi
          testlab report --results $jsons --out reports/compat_matrix.html

      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-matrix-report
          path: reports/compat_matrix.html
