# configs/basic_ecu.yaml
#
# TestLab config for: basic_ecu (Zephyr native_sim, CAN transport)
#
# Run standalone (CAN/vcan0):
#   testlab-run --config configs/basic_ecu.yaml \
#               --campaign campaigns/core_validation.yaml \
#               --job core_validation --interface vcan0 \
#               --json reports/basic_ecu_run.json
#
# Run in-process (--virtual, no hardware):
#   testlab-run --config configs/basic_ecu.yaml \
#               --campaign campaigns/core_validation.yaml \
#               --job core_validation --virtual \
#               --json reports/virtual_run.json

metadata:
  ecu_name: BasicECU
  version:  "0.1.0"
  description: "BasicECU — Zephyr native_sim, CAN transport (ISO-TP over SocketCAN)"

can:
  rx_can_id: "0x7DF"   # tester sends requests to this ID (ECU listens here)
  tx_can_id: "0x7E8"   # ECU sends responses on this ID (tester receives here)

timing:
  p2_server_max_ms:      25
  p2_star_server_max_ms: 5000
  s3_server_timeout_ms:  5000

dids:
  - id:   "0xF190"
    name: "Vehicle Identification Number"
    access: [read]
    min_session: default
    read_security_level:  0
    write_security_level: 1
    data_length: 17

  - id:   "0xF18C"
    name: "ECU Serial Number"
    access: [read]
    min_session: default
    read_security_level:  0
    write_security_level: 1
    data_length: 4

  - id:   "0xF187"
    name: "Vehicle Manufacturer Spare Part Number"
    access: [read, write]
    min_session: extended
    read_security_level:  0
    write_security_level: 1
    data_length: 11

dtcs:
  - code:        "0xC00100"
    description: "CAN bus communication loss"
    severity:    check_at_next_halt

  - code:        "0xC00200"
    description: "Diagnostic transport layer timeout"
    severity:    maintenance_only
