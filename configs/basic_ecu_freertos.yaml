# configs/basic_ecu_freertos.yaml
#
# TestLab config for: basic_ecu_freertos (QEMU Cortex-M4, CAN transport)
#
# Same DID / DTC set as basic_ecu — only the RTOS and build toolchain differ.
# CAN IDs are identical: the QEMU CAN target uses a Linux vcan0 bridge.
#
# Run with:
#   testlab-run --config configs/basic_ecu_freertos.yaml \
#               --campaign campaigns/core_validation.yaml \
#               --job core_validation --interface vcan0 \
#               --json reports/basic_ecu_freertos_run.json

metadata:
  ecu_name: BasicECU_FreeRTOS
  version:  "0.1.0"
  description: "BasicECU — QEMU Cortex-M4, FreeRTOS, CAN transport (ISO-TP over SocketCAN)"

can:
  rx_can_id: "0x7DF"
  tx_can_id: "0x7E8"

timing:
  p2_server_max_ms:      25
  p2_star_server_max_ms: 5000
  s3_server_timeout_ms:  5000

dids:
  - id:   "0xF190"
    name: "Vehicle Identification Number"
    access: [read]
    min_session: default
    read_security_level:  0
    write_security_level: 1
    data_length: 17

  - id:   "0xF18C"
    name: "ECU Serial Number"
    access: [read]
    min_session: default
    read_security_level:  0
    write_security_level: 1
    data_length: 4

  - id:   "0xF187"
    name: "Vehicle Manufacturer Spare Part Number"
    access: [read, write]
    min_session: extended
    read_security_level:  0
    write_security_level: 1
    data_length: 11

dtcs:
  - code:        "0xC00100"
    description: "CAN bus communication loss"
    severity:    check_at_next_halt

  - code:        "0xC00200"
    description: "Diagnostic transport layer timeout"
    severity:    maintenance_only
